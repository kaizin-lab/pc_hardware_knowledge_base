# ai_inference_local_pro
# Домен: Compute (локальный запуск тяжёлых LLM)
# 
# ДИРЕКТИВА LLM: все ссылки вида path/to/file.md#section — navigable references.
# Загрузи файл, найди секцию, извлеки конкретику. Без этого расчёты не делать.

uri: "intent#ai_inference_local_pro"
type: "SystemRequirementsVector"
domain: "ai_compute"
description: >
  Локальный инференс языковых моделей 7B–32B параметров с высокой
  скоростью генерации токенов. Модель должна полностью помещаться
  в VRAM без offload. Критичны: объём VRAM, пропускная способность
  памяти, тензорные ядра.

requirements:
  budget_allocation_priority: "GPU"
  domain_modules_required: ["pcbo:modules/ai_compute"]

  constraints:
    max_acceptable_noise_load: "A3"
    max_acceptable_noise_note: "Инференс — длительная равномерная нагрузка. GPU постоянно под 70–100% TGP. Можно поставить под стол."
    max_acceptable_thermal_state: "T_Warm"
    max_acceptable_thermal_note: "Непрерывная нагрузка 24/7. Компоненты должны работать без деградации."
    min_ram_capacity_gb: 64
    min_ram_note: "Для offload больших моделей (32B+) и предобработки датасетов. 32GB — минимум, 64GB — комфорт."
    min_storage_sustained_write: false
    min_storage_note: "Модель загружается один раз. NVMe Gen4 достаточно."

  maut_weights:
    performance_importance: 0.9
    performance_note: "Токены в секунду — главная метрика"
    silence_importance: 0.1
    silence_note: "Можно поставить под стол"
    thermal_margin_importance: 0.5
    thermal_note: "24/7 без деградации — важно"
    upgrade_longevity_importance: 0.7
    longevity_note: "Апгрейд GPU (больше VRAM) и RAM критичен"

profile_interaction_matrix:
  mandatory_steel_man:
    - profile: "concepts/epistemological-profiles.md#tensor_matrix_accelerated"
      reason: "Тензорные ядра (NVIDIA Tensor Cores / Intel XMX) — ×4–8 ускорение матричного перемножения vs FP32. Без них инференс медленный."

  strict_block:
    - profile: "concepts/epistemological-profiles.md#sub_75w_slot_powered"
      reason: "Карты без внешнего питания (≤ 75W). Не имеют достаточного VRAM и тензорных ядер для LLM. Физически невозможно. BLOCK."

  warn:
    - profile: "concepts/epistemological-profiles.md#bandwidth_constrained_vram_rich"
      reason: "Узкая 128-bit шина снижает t/s на 20–40% vs 256-bit при том же VRAM. Модель работает, но медленнее. WARN — сборка возможна, но не optimal."
