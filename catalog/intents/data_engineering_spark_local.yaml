# data_engineering_spark_local
# Домен: Compute (тяжёлая обработка данных, sustained I/O)
# 
# ДИРЕКТИВА LLM: все ссылки вида path/to/file.md#section — navigable references.
# Загрузи файл, найди секцию, извлеки конкретику. Без этого расчёты не делать.

uri: "intent#data_engineering_spark_local"
type: "SystemRequirementsVector"
domain: "data_engineering"
description: >
  Локальная обработка данных: Apache Spark, pandas на датасетах 50–200 GB,
  SQL-аналитика в оперативной памяти. Критичны: объём RAM, sustained write
  на SSD (Spark shuffle, checkpoint) и многопоточность CPU.

requirements:
  budget_allocation_priority: "RAM"
  domain_modules_required: ["pcbo:modules/data_engineering"]

  constraints:
    max_acceptable_noise_load: "A3"
    max_acceptable_noise_note: "Длительные batch-задачи. Система может стоять в отдельной комнате."
    max_acceptable_thermal_state: "T_Warm"
    max_acceptable_thermal_note: "Непрерывная нагрузка на CPU и SSD. T_Warm при отсутствии throttling — норма."
    min_ram_capacity_gb: 64
    min_ram_note: "Spark executor 16GB heap × 4 параллельных таска = 64GB минимум. 128GB recommended."
    min_storage_sustained_write: true
    min_storage_note: "КРИТИЧНО. Spark shuffle пишет на диск непрерывно. Без sustained write — падение на порядок после SLC-кэша."

  maut_weights:
    performance_importance: 0.8
    performance_note: "Многопоточность CPU и sustained I/O — главные метрики"
    silence_importance: 0.2
    silence_note: "Не критично — batch-задачи"
    thermal_margin_importance: 0.6
    thermal_note: "Длительные нагрузки — охлаждение важно"
    upgrade_longevity_importance: 0.5
    longevity_note: "Добавление RAM, замена SSD — типичный путь"

profile_interaction_matrix:
  mandatory_steel_man:
    - profile: "concepts/epistemological-profiles.md#multi_ccd_disaggregated"
      reason: "12–16 ядер на потребительской платформе. Spark/dask распараллеливают таски — каждое ядро даёт линейный прирост."
    - profile: "concepts/epistemological-profiles.md#standard_tlc_dram_ssd"
      reason: "TLC NAND + DRAM-буфер. Sustained write ≥ 1.5 GB/s без падения. Spark shuffle, логи СУБД, checkpoint."

  strict_block:
    - profile: "concepts/epistemological-profiles.md#dram_less_hmb_cached"
      reason: >
        DRAM-less SSD под тяжёлым I/O. Два механизма отказа: (1) sustained write падает до 100–300 MB/s
        после SLC-кэша; (2) HIGH WRITE AMPLIFICATION — контроллер без DRAM «мусорит» в NAND (нет таблицы
        FTL в DRAM), ресурс TBW исчерпывается в 3–5× быстрее. Под логами СУБД — выход из строя через
        6–12 месяцев. CLIFF_DROP — BLOCK.
    - profile: "concepts/epistemological-profiles.md#read_heavy_static"
      reason: "QLC-память. После SLC-кэша скорость падает до 80–150 MB/s. Spark shuffle на QLC — таймаут задачи. BLOCK."
